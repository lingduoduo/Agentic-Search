version: "3.8"

# Full local stack for Agentic Search.
#
# Bring up infrastructure only:
#   docker compose -f docker/docker-compose.yml up postgres redis weaviate
#
# Bring up everything:
#   docker compose -f docker/docker-compose.yml up --build
#
# All service-to-service hostnames match the service names below.
# Override any value by creating a docker/docker-compose.override.yml or
# by setting environment variables before running docker compose.

x-app-env: &app-env
  # --- PostgreSQL ---
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: agentic_search
  POSTGRES_USER: agentic
  POSTGRES_PASSWORD: agentic_pass
  POSTGRES_POOL_RECYCLE: "3600"

  # --- Redis ---
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  REDIS_USE_SSL: "False"

  # --- Celery (uses Redis DB 1) ---
  CELERY_BROKER_DB: "1"
  CELERY_RESULT_BACKEND_DB: "1"
  CELERY_TASK_IGNORE_RESULT: "False"
  CELERY_RESULT_EXPIRES: "3600"
  CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "True"

  # --- Weaviate ---
  WEAVIATE_HTTP_HOST: weaviate
  WEAVIATE_HTTP_PORT: "8080"
  WEAVIATE_GRPC_HOST: weaviate
  WEAVIATE_GRPC_PORT: "50051"
  WEAVIATE_API_KEY: ""

  # --- LLM (override with real keys in .env) ---
  GEN_AI_MODEL_PROVIDER: openai
  GEN_AI_MODEL_VERSION: gpt-4o-mini
  GEN_AI_API_KEY: ""
  GEN_AI_MAX_INPUT_TOKENS: "8192"

  # --- Services ---
  AGENTIC_SEARCH_RETRIEVAL_URL: http://retrieval:8000/retrieve
  AGENTIC_SEARCH_WEB_DB_PATH: /data/agentic_search.db
  AGENTIC_SEARCH_WEB_PORT: "7860"
  ENABLE_OPENSEARCH_INDEXING: "False"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_search
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_search"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.29.0
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_VECTORIZER: none
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_API_BASED_MODULES: "false"
      CLUSTER_HOSTNAME: weaviate-node
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "8090:8080"   # HTTP — offset to avoid collision with the web backend
      - "50051:50051" # gRPC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - agentic_search_default

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  retrieval:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    command: >
      python -m src.internal.servers.retrieval.demo
      --corpus_path /data/corpus.jsonl
      --host 0.0.0.0
      --port 8000
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - app_data:/data
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  app_data:

networks:
  agentic_search_default:
    name: agentic_search_default
