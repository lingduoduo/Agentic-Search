name: Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  retrieval-eval-gate:
    name: Retrieval Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check baseline exists
        id: check
        run: |
          if [ -f data/eval/baseline_metrics.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report gate status
        run: |
          if [ "${{ steps.check.outputs.exists }}" != "true" ]; then
            msg="Retrieval eval gate INACTIVE: no data/eval/baseline_metrics.json committed (see docs/training-and-evaluation.md)."
            echo "::warning title=Eval gate inactive::$msg"
            echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Run retrieval eval
        if: steps.check.outputs.exists == 'true'
        env:
          BM25_INDEX_PATH: ${{ secrets.BM25_INDEX_PATH }}
          BM25_CORPUS_PATH: data/corpus.jsonl
          RETRIEVAL_BACKEND: local
        run: |
          python -m src.internal.retrieval.eval_runner \
            --dataset data/eval/qa_pairs.jsonl \
            --top_k 10 \
            --output /tmp/current_metrics.json

      - name: Check for regressions
        if: steps.check.outputs.exists == 'true'
        run: |
          python - <<'EOF'
          import json, os, sys
          baseline = json.load(open("data/eval/baseline_metrics.json"))
          current  = json.load(open("/tmp/current_metrics.json"))

          gated = ["recall@10", "ndcg@10"]
          if all((baseline.get(k) or 0) == 0 for k in gated):
              msg = (
                  "Retrieval eval gate INACTIVE: baseline is a zero placeholder; "
                  "not enforcing regressions (see docs/training-and-evaluation.md)."
              )
              print(f"::warning title=Eval gate inactive::{msg}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  open(summary, "a").write(f"⚠️ {msg}\n")

          failures = []
          for key, threshold in [("recall@10", 0.02), ("ndcg@10", 0.01)]:
              base_val = baseline.get(key)
              curr_val = current.get(key)
              if base_val is None or curr_val is None:
                  continue
              drop = base_val - curr_val
              if drop > threshold:
                  failures.append(
                      f"{key}: dropped {drop:.4f} (baseline={base_val:.4f}, current={curr_val:.4f})"
                  )

          if failures:
              print("EVAL REGRESSION DETECTED:")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          else:
              print("No regressions. current:", json.dumps(current, indent=2))
          EOF

  ragas-eval-gate:
    name: RAGAS Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check baseline exists
        id: check
        run: |
          if [ -f data/eval/ragas_baseline.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report gate status
        run: |
          if [ "${{ steps.check.outputs.exists }}" != "true" ]; then
            msg="RAGAS eval gate INACTIVE: no data/eval/ragas_baseline.json committed (see docs/training-and-evaluation.md)."
            echo "::warning title=Eval gate inactive::$msg"
            echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          pip install -e .
          pip install -r requirements.txt
          pip install ragas

      - name: Run RAGAS eval
        if: steps.check.outputs.exists == 'true'
        env:
          BM25_INDEX_PATH: ${{ secrets.BM25_INDEX_PATH }}
          BM25_CORPUS_PATH: data/corpus.jsonl
          RETRIEVAL_BACKEND: local
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.internal.retrieval.ragas_eval \
            --dataset data/eval/ragas_qa.jsonl \
            --metrics faithfulness answer_relevancy \
            --output /tmp/ragas_current.json \
            --baseline data/eval/ragas_baseline.json

  intent-routing-gate:
    name: Intent Routing Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The encoder is ~130MB and the install pulls torch. Both are why this
      # lives here rather than in the fast unit-test lane, which deliberately
      # excludes heavy ML packages (see requirements-unit-test.txt).
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-e5-small-v2

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      # Everything this gate needs is committed: the canonical set, the
      # evaluation queries, and the out-of-scope probes. The index is a
      # gitignored artifact regenerable from them, so unlike the retrieval and
      # RAGAS gates above there is no baseline to commit and no secret to set —
      # this gate is active from its first run.
      - name: Build the intent index
        run: |
          python -m src.model.intent_index_cli build \
            --canonical data/intent_canonical.json \
            --output data/intent_index

      - name: Run the pinned routing bars
        run: |
          python -m pytest \
            tests/unit/test_intent_index_eval.py \
            tests/unit/test_intent_canonical_data.py \
            -v --junitxml=/tmp/intent-bars.xml

      # The bars skip themselves when sentence-transformers or the index is
      # absent, so a job that merely runs them would stay green in exactly the
      # situation it exists to catch. A skip here means the environment is wrong,
      # which is a gate failure, not a pass.
      - name: Fail if any bar skipped
        if: always()
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("/tmp/intent-bars.xml")
          skipped = [
              case.get("name")
              for case in tree.iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              print("::error title=Intent gate did not actually run::")
              for name in skipped:
                  print(f"  SKIPPED: {name}")
              print(
                  "\nThese bars skip when sentence-transformers or data/intent_index/ "
                  "is missing. A skip means the gate did not measure anything."
              )
              sys.exit(1)
          print(f"All {len(list(tree.iter('testcase')))} bars ran; none skipped.")
          EOF
