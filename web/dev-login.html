<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dev login</title>
    <!--
      DEV SERVER ONLY. Vite serves this at /dev-login.html; it is not a build
      input, so `npm run build` does not emit it into web/dist/. Keep it that
      way — POST /auth/register makes the FIRST user an admin, so a page that
      self-registers a known credential must never be served in production.

      Exists because the app has no login UI and the Search/Chat/Tool tabs
      require an authenticated user. See docs/frontend.md.
    -->
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 34rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
      pre {
        background: #f4f4f5;
        padding: 0.75rem;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      .ok {
        color: #15803d;
      }
      .bad {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>Dev login</h1>
    <p>
      Registers <code>dev@localhost</code> (if needed) and logs in, so the
      <code>fastapiusersauth</code> cookie is set for this origin. The Search tab
      needs it.
    </p>
    <button id="go">Log in</button>
    <pre id="out">Not run yet.</pre>
    <p><a href="/">← back to the dashboard</a></p>

    <script>
      const out = document.getElementById("out");
      const say = (msg, cls) => {
        out.textContent = msg;
        out.className = cls || "";
      };

      document.getElementById("go").addEventListener("click", async () => {
        say("Working…");
        try {
          const reg = await fetch("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: "dev@localhost",
              username: "dev",
              password: "devpass",
            }),
          });
          const regText = reg.ok ? "registered" : "already registered (fine)";

          const login = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "username=dev@localhost&password=devpass",
            credentials: "same-origin",
          });
          const body = await login.json();
          if (!login.ok) {
            say("Login failed: " + JSON.stringify(body), "bad");
            return;
          }

          const me = await fetch("/me", { credentials: "same-origin" });
          const meBody = await me.json();
          say(
            "Register: " +
              regText +
              "\nLogin: ok\n/me: " +
              JSON.stringify(meBody, null, 2) +
              "\n\nDone — go back to the dashboard and click Search.",
            "ok",
          );
        } catch (err) {
          say("Error: " + err, "bad");
        }
      });
    </script>
  </body>
</html>
